<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 배경: 블루 → 인디고 → 바이올렛 대각 그라데이션 -->
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#6E8BFF"/>
      <stop offset="0.55" stop-color="#5A6CF0"/>
      <stop offset="1" stop-color="#6A45F5"/>
    </linearGradient>

    <!-- 상단 광택(sheen) -->
    <radialGradient id="sheen" cx="0.3" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 제목 줄 강조색 -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#7B5CFF"/>
    </linearGradient>

    <!-- AI 스파클(앰버) -->
    <radialGradient id="spark" cx="0.5" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.5" stop-color="#FFC24D"/>
      <stop offset="1" stop-color="#FF9A3D"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#sheen)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- 문서 그림자 -->
  <rect x="30" y="30" width="54" height="76" rx="12" fill="#1F2A78" opacity="0.30" filter="url(#soft)"/>

  <!-- 문서 카드 (우상단 접힘) -->
  <path d="M41 24 L68 24 L84 40 L84 89 Q84 100 73 100 L41 100 Q30 100 30 89 L30 35 Q30 24 41 24 Z"
        fill="#FFFFFF"/>
  <!-- 접힌 모서리 -->
  <path d="M68 24 L84 40 L68 40 Z" fill="#C4D1F4"/>

  <!-- 요약 줄: 제목(강조) + 점점 짧아지는 본문 -->
  <rect x="41" y="39" width="30" height="7" rx="3.5" fill="url(#accent)"/>
  <rect x="41" y="55" width="34" height="5" rx="2.5" fill="#D3DBEE"/>
  <rect x="41" y="65" width="27" height="5" rx="2.5" fill="#D3DBEE"/>
  <rect x="41" y="75" width="19" height="5" rx="2.5" fill="#D3DBEE"/>

  <!-- AI 스파클 글로우 -->
  <circle cx="95" cy="92" r="19" fill="#FFB53D" opacity="0.22" filter="url(#glow)"/>
  <!-- 큰 스파클 -->
  <path d="M95 75 Q95 92 112 92 Q95 92 95 109 Q95 92 78 92 Q95 92 95 75 Z" fill="url(#spark)"/>
  <!-- 작은 스파클 -->
  <path d="M79 75 Q79 80 84 80 Q79 80 79 85 Q79 80 74 80 Q79 80 79 75 Z" fill="#FFE39A"/>
</svg>
